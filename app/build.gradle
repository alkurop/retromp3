plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

apply from: "$scripts.android_common"

android {
    namespace "${rootProject.ext.applicationId}.app"

    defaultConfig {
        applicationId "${rootProject.ext.applicationId}.app"
        testApplicationId "${rootProject.ext.applicationId}.app.test"

        versionCode 371
        versionName "3.71"
        signingConfig signingConfigs.debug
    }

    buildFeatures {
        compose true
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        debug {
            minifyEnabled false
            debuggable true
        }
    }

    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:$versions.support"
    implementation "com.google.accompanist:accompanist-permissions:0.29.0-alpha"
    implementation "com.squareup.picasso:picasso:$versions.picasso"
    implementation "com.github.alkurop:stringerbell:$versions.stringerbell"
    implementation "com.jakewharton.rxbinding4:rxbinding:$versions.rxView"
    implementation "com.github.alkurop:Android-Runtime-Permission-Manager:$versions.permission"
    implementation "androidx.fragment:fragment-ktx:$versions.ktxFragment"

    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$versions.lifecycle"
    implementation "com.github.alkurop:ghostinshell:$versions.ghostinshell"

    //compose
    def composeBom = platform("androidx.compose:compose-bom:2023.01.00")
    implementation composeBom
    androidTestImplementation composeBom
    implementation "androidx.activity:activity-compose:1.6.1"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling"
    implementation "androidx.compose.runtime:runtime-rxjava3"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.ui:ui-tooling-preview"
    debugImplementation "androidx.compose.ui:ui-tooling"
    debugImplementation "androidx.compose.ui:ui-test-manifest"

    //lifecycle
    def lifecycle_version = "2.6.0-alpha05"
    implementation "androidx.lifecycle:lifecycle-viewmodel-savedstate:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-common-java8:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:$lifecycle_version"
    kapt "androidx.lifecycle:lifecycle-common:$lifecycle_version"

    def nav_version = "2.5.3"
    implementation "androidx.navigation:navigation-compose:$nav_version"

    implementation "androidx.paging:paging-compose:$versions.composePaging"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:$versions.composeViewModel"
    implementation "com.google.accompanist:accompanist-appcompat-theme:0.25.1"
    implementation "androidx.constraintlayout:constraintlayout-compose:$versions.composeConstraint"
    implementation "com.google.android.material:material:$versions.material"

    implementation "com.google.dagger:dagger:$versions.dagger"
    kapt "com.google.dagger:dagger-compiler:$versions.dagger"

    implementation project(':utils')
    implementation project(':io-mp3recorder')
    implementation project(':io-audioplayer')
    implementation project(':io-audio-tansformer')
    implementation project(':io-share')
    implementation project(':ui-wavetable')
    implementation project(':usecases')
    implementation project(':storage')
    implementation project(':domain:platform')

    // Import the BoM for the Firebase platform
    implementation platform("com.google.firebase:firebase-bom:$versions.firebase")

    // Declare the dependencies for the Crashlytics and Analytics libraries
    // When using the BoM, you don't specify versions in Firebase library dependencies
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-analytics'

    androidTestImplementation "androidx.test.espresso:espresso-core:$versions.espressoCore"
    androidTestImplementation "androidx.test:runner:$versions.espresso"
    androidTestImplementation "androidx.test:rules:$versions.espresso"
    androidTestImplementation "androidx.test.ext:junit-ktx:$versions.junitKtx"

}
