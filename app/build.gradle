plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'com.google.dagger.hilt.android'
}

apply from: "$scripts.android_common"

android {
    namespace "${rootProject.ext.applicationId}.app"

    defaultConfig {
        applicationId "${rootProject.ext.applicationId}.app"
        testApplicationId "${rootProject.ext.applicationId}.app.test"

        versionCode 401
        versionName "4.01"
        signingConfig signingConfigs.debug
    }

    buildFeatures {
        compose true
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        debug {
            minifyEnabled false
            debuggable true
        }
    }

    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
}

apply from: "$scripts.android_test_compose_dependency"
apply from: "$scripts.test_dependency"

dependencies {
    implementation "com.google.accompanist:accompanist-permissions:$versions.accompanist_permissions"
    implementation "com.squareup.picasso:picasso:$versions.picasso"
    implementation "com.github.alkurop:stringerbell:$versions.stringerbell"

    implementation "com.github.alkurop:ghostinshell:$versions.ghostinshell"

    //compose
    def composeBom = platform("androidx.compose:compose-bom:$versions.compose_bom")
    implementation composeBom
    androidTestImplementation composeBom
    implementation "androidx.activity:activity-compose"
    implementation "androidx.compose.ui:ui-tooling-preview"
    debugImplementation "androidx.compose.ui:ui-tooling"
    debugImplementation "androidx.compose.ui:ui-test-manifest"

    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.runtime:runtime-rxjava3"
    implementation "androidx.compose.material3:material3"

    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:$versions.lifecycle"
    implementation "com.google.accompanist:accompanist-navigation-animation:$versions.navigationAnimation"
    implementation "androidx.paging:paging-compose:$versions.composePaging"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:$versions.composeViewModel"
    implementation "androidx.constraintlayout:constraintlayout-compose:$versions.composeConstraint"
    implementation "com.google.android.material:material:$versions.material"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-rx3:$versions.rxCoroutines"
    implementation "io.reactivex.rxjava3:rxandroid:$versions.rxAndroid"

    //hilt
    implementation "com.google.dagger:hilt-android:$versions.hilt"
    implementation "androidx.hilt:hilt-navigation-compose:$versions.hilt_compose"
    kapt "com.google.dagger:hilt-compiler:$versions.hilt"

    implementation project(':utils')
    implementation project(':io')
    implementation project(':ui')
    implementation project(':usecases')

    testImplementation project(':data:mock')

    // Import the BoM for the Firebase platform
    implementation platform("com.google.firebase:firebase-bom:$versions.firebase")

    // Declare the dependencies for the Crashlytics and Analytics libraries
    // When using the BoM, you don't specify versions in Firebase library dependencies
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-analytics'

    constraints {
        implementation "androidx.compose.foundation:foundation:$versions.compose"
        implementation "androidx.compose.ui:ui:$versions.compose"
        implementation "androidx.compose.runtime:runtime:$versions.compose"
    }
}
