plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'kotlin-kapt'
}

apply from: "$scripts.android_library"
apply from: "$scripts.test_dependency"


android {
    namespace "${applicationId}.io.billing"
}

dependencies {
    implementation project(':utils')
    implementation project(':entity')

    implementation("com.android.billingclient:billing-ktx:$versions.billing")

    implementation "com.google.dagger:hilt-android:$versions.hilt"
    kapt "com.google.dagger:hilt-compiler:$versions.hilt"

    testImplementation project(':data:mock')

}
