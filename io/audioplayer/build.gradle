plugins {
    id "com.android.library"
    id "kotlin-android"
}

apply from: "$scripts.android_library"

android {
    namespace "${applicationId}.audioplayer"
}

dependencies {
    implementation project(':utils:domain')
    implementation project(':domain:platform')
    implementation "com.github.alkurop:stringerbell:$versions.stringerbell"
    implementation "com.google.dagger:dagger:$versions.dagger"
    implementation "com.google.android.exoplayer:exoplayer-core:$versions.exo"
}
