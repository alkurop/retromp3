plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'kotlin-kapt'
}

android {
    compileSdk rootProject.ext.compileSdk

    defaultConfig {
        minSdk rootProject.ext.minSdk
        targetSdk rootProject.ext.targetSdk

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                        "room.schemaLocation"  : "$projectDir/schemas".toString(),
                        "room.incremental"     : "true",
                        "room.expandProjection": "true"]
            }
        }
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
    namespace 'com.omar.retromp3recorder.storage'
}

dependencies {
    implementation project(":utils")
    implementation project(':io-mp3recorder')
    implementation project(':io-audioplayer')
    implementation project(':io-share')
    implementation "com.github.alkurop:stringerbell:$versions.stringerbell"
    implementation "com.github.alkurop:ghostinshell:$versions.ghostinshell"
    implementation "androidx.room:room-runtime:$versions.room"
    api "androidx.paging:paging-runtime-ktx:$versions.paging"

    kapt "androidx.room:room-compiler:$versions.room"

    implementation "com.google.dagger:dagger:$versions.dagger"
    kapt "com.google.dagger:dagger-compiler:$versions.dagger"

    constraints {
        implementation("androidx.lifecycle:lifecycle-viewmodel-ktx:$versions.lifecycle") {
            because 'Because of confliciting versions we have a failing circle ci'
        }
    }
}

