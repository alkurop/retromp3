plugins {
    id 'com.android.library'
    id 'kotlin-android'
}

apply from :"$scripts.android_library"

android {
    namespace "${applicationId}.io.recorder"
}

dependencies {
    implementation project(':utils')
    implementation "com.github.alkurop:stringerbell:$versions.stringerbell"
    implementation "com.google.dagger:dagger:$versions.dagger"
    implementation 'com.github.alkurop:LameMp3RecorderModule:0.5'
}
