plugins {
    id 'com.android.library'
    id 'kotlin-android'
}

apply from: "$scripts.android_library"

android {
    namespace "${applicationId}.ui.wavetable"
}

dependencies {
    implementation project(':utils:domain')
    implementation project(':domain:platform')
    implementation "androidx.constraintlayout:constraintlayout:$versions.constraintLayout"
    implementation "androidx.appcompat:appcompat:$versions.support"
}
